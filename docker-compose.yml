name: plataforma_sso-v1

# A tela de login do IdP e o console, servidos por nginx. O nginx repassa /sso
# ao SSO pelo endereco da maquina: a mesma origem que o proxy do Vite oferece em
# desenvolvimento, e que o rewrite do hosting oferece em producao. Suba o SSO
# antes de abrir a tela.
#
# O build instala @pedrolucaslopes/dotlog-ui do GitHub Packages: rode num
# terminal com NODE_AUTH_TOKEN (token classico com read:packages). Ele entra como
# secret do BuildKit, so durante o `npm ci`, e nao fica na imagem.

services:
  sso-plataforma:
    build:
      context: .
      target: runtime
      secrets:
        - NODE_AUTH_TOKEN
    restart: unless-stopped
    environment:
      # O nginx resolve este nome pelo DNS do Docker a cada requisicao e nao le
      # o /etc/hosts, entao `extra_hosts` nao ajudaria aqui. O Docker Desktop
      # responde host.docker.internal nesse DNS; em Docker Engine no Linux, use o
      # IP do host.
      SSO_UPSTREAM: http://host.docker.internal:8080
    ports:
      - "${PLATAFORMA_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

secrets:
  # Token do GitHub com `read:packages`, lido do ambiente de quem roda o build.
  # Nunca em arquivo versionado, nunca como ARG.
  NODE_AUTH_TOKEN:
    environment: NODE_AUTH_TOKEN
