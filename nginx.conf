# Template: o entrypoint da imagem troca ${SSO_UPSTREAM} pelo ambiente no boot.
# As variaveis do proprio nginx ($uri, $host, $csp_policy) nao sao tocadas.

server {
  listen       8080;
  server_name  _;

  # A versao no cabecalho `Server` so serve a quem procura alvo por versao.
  server_tokens off;

  root  /usr/share/nginx/html;
  index index.html;

  # ⚠️ `add_header` num location DESCARTA os herdados do server. Todo location
  # que declara o proprio header repete os de seguranca, senao o index.html,
  # que e a tela de login do IdP, sairia sem protecao contra ser embutido.
  # Clickjacking na tela de autorizacao: RFC 6749 secao 10.13.

  # A politica de conteudo, escrita uma vez e repetida onde for preciso.
  #
  # Esta e a pagina de maior confianca do ecossistema: sem `script-src 'self'`,
  # qualquer injecao viraria execucao na tela onde as pessoas entram. O build
  # nao gera script inline, so os bundles de /assets; `style-src` precisa de
  # 'unsafe-inline' porque o Vuetify escreve estilo no proprio elemento, e tudo
  # o que o console chama esta na mesma origem.
  set $csp_policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'";

  # Endpoint de health para o compose e para o Cloud Run.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # A API do SSO na mesma origem do console, como o proxy do Vite faz em
  # desenvolvimento. Sem ${SSO_UPSTREAM}, responde 404: em producao o rewrite do
  # hosting manda /sso ao servico do SSO antes de chegar aqui.
  location /sso/ {
    set $sso_upstream "${SSO_UPSTREAM}";

    if ($sso_upstream = "") {
      return 404;
    }

    # DNS do Docker, resolvido por requisicao: o nginx sobe mesmo antes do SSO.
    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_pass $sso_upstream;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Assets com hash no nome podem ser cacheados de forma agressiva.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    try_files $uri =404;
  }

  # O index nunca pode ser cacheado, senao o deploy novo nao chega ao usuario.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  }

  # SPA: qualquer rota desconhecida cai no index e o vue-router resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Nem o console nem a tela de login sao embutiveis em pagina de terceiro.
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy $csp_policy always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
